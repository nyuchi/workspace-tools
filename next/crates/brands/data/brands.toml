# The one Bundu-ecosystem brand list.
#
# Replaces the three hand-synced copies in the live app (the TypeScript
# registry in signature-generator/src/engines/brands, the slug-keyed BRANDS
# in gmail-addon/Code.js, and the domain-keyed CONFIG.divisions in
# email-signature/Code.js). Signatures, the Studio, the site and the MCP all
# read this file; nothing keeps a copy.
#
# Taxonomy (bundu.org): Bundu Foundation is the parent; Nyuchi Africa,
# Mukoko and Shamwari AI are its pillars; divisions sit under a pillar;
# initiatives are Bundu Foundation projects, not brands.
#
# Fields:
#   key        stable slug — never rename, add a new key instead
#   kind       foundation | pillar | division | initiative
#   parent     key of the parent (absent for bundu)
#   name, tagline, url
#   domains    email domains whose staff sign as this brand (the first is
#              the brand's own); a domain appears under exactly one brand
#   mineral    the brand's Mzizi mineral (colour family)
#   socials    official accounts only
#
# Wording follows the canonical registry. Where the old signature copies
# differed (Mukoko's "Your Digital Twin Ecosystem", Learning's "Education
# for Africa's Future"), the registry wins — decision 2 on #70 ended the
# byte-lock on the historical signature.

[[brand]]
key = "bundu"
kind = "foundation"
name = "Bundu Foundation"
tagline = "The wilderness holds the hive"
url = "https://bundu.org"
domains = ["bundu.org"]
mineral = "copper"
socials = {}

[[brand]]
key = "nyuchi"
kind = "pillar"
parent = "bundu"
name = "Nyuchi Africa"
tagline = "I am because we are"
url = "https://nyuchi.com"
domains = ["nyuchi.com"]
mineral = "gold"
socials = { linkedin = "https://www.linkedin.com/company/nyuchi/", facebook = "https://facebook.com/nyuchigroup", instagram = "https://instagram.com/nyuchi.africa" }

[[brand]]
key = "mukoko"
kind = "pillar"
parent = "bundu"
name = "Mukoko"
tagline = "Africa's privacy-first social super-app"
url = "https://mukoko.com"
domains = ["mukoko.com"]
mineral = "tanzanite"
socials = { facebook = "https://facebook.com/mukokoafrica", instagram = "https://instagram.com/mukoko.africa" }

[[brand]]
key = "shamwari"
kind = "pillar"
parent = "bundu"
name = "Shamwari AI"
tagline = "AI that actually works for Africa"
url = "https://shamwari.ai"
domains = ["shamwari.ai"]
mineral = "sodalite"
socials = {}

