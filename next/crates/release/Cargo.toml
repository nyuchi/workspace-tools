[package]
name = "nyuchi-release"
version = "0.1.0"
description = "The release marketing pipeline: one live release becomes a Sanity draft, Postiz drafts and a rendered image set."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nyuchi-release"
path = "src/bin/nyuchi-release.rs"

[dependencies]
nyuchi-imaging = { path = "../imaging" }
nyuchi-brands = { path = "../brands" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
