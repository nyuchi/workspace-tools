# The nyuchi-tools preset catalogue.
#
# Every output size the tools render is a row here, not a constant in code:
# adding a platform is a data change. Each preset is:
#
#   id          stable key used by the CLI, the campaign files and (later) the
#               MCP tools — never rename one, add a new id instead
#   name        human label
#   platform    where the image is used
#   group       social | store | web | email | icon
#   width/height  exact output pixels
#   format      "jpeg" (opaque, no alpha possible) or "png"
#   safe        [top, right, bottom, left] insets in pixels that platform UI
#               covers (story chrome, caption bars, timestamps). Text and the
#               screenshot card are laid out inside them; the background
#               still bleeds to the edge.
#   max_bytes   the platform's upload ceiling, checked after encoding
#   alpha       false where the platform rejects transparency
#   legacy      the old name this replaces, when carried over
#
# Sources: the Chrome Web Store image rules (1280x800 / 640x400 screenshots,
# 440x280 / 1400x560 tiles, no alpha), the Toddle extension's store renders
# (store/src in nyuchi/toddle-enhancement-extension), the Nyuchi Studio
# FORMATS table (signature-generator/src/engines/nyuchi), and each platform's
# 2026 creative specs. Safe areas follow Meta's 9:16 guidance (keep the top
# ~250px and bottom ~340px clear of text) and TikTok/Reels' right-hand action
# rail.

# ── Social ──────────────────────────────────────────────────────────────

[[preset]]
id = "story"
name = "Story 9:16"
platform = "Instagram / Facebook / WhatsApp Status stories"
group = "social"
width = 1080
height = 1920
format = "png"
safe = [250, 64, 340, 64]
max_bytes = 30_000_000
alpha = false
legacy = "studio:story (no safe areas)"

[[preset]]
id = "reel-cover"
name = "Reel / TikTok cover 9:16"
platform = "Instagram Reels, TikTok, YouTube Shorts"
group = "social"
width = 1080
height = 1920
format = "png"
# The profile grid shows the centre 3:4 (1080x1440) of a reel cover, and the
# player overlays a caption bar and an action rail on the right.
safe = [240, 140, 420, 64]
max_bytes = 30_000_000
alpha = false

