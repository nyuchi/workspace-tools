[package]
name = "nyuchi-imaging"
version = "0.1.0"
description = "Preset catalogue and renderer for nyuchi-tools images: store screenshots, social cards, stories, icons."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nyuchi-img"
path = "src/bin/nyuchi-img.rs"

[dependencies]
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"] }
jpeg-encoder = "0.7"
imagesize = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
base64 = "0.22"
ttf-parser = "0.25"
png = "0.18"
