# The rebuilt nyuchi-tools Worker (#70): Rust (workers-rs) API + the Astro
# site as static assets. NOT LIVE: no routes and no workers.dev URL, because
# the API has no login yet — phase 3 adds the WorkOS gate (the "Nyuchi
# Internal Tools" Connect client, configured by vars, never hardcoded)
# before this Worker gets a route. Until then it runs under `wrangler dev`.
name = "nyuchi-tools-next"
main = "crates/worker/build/index.js"
account_id = "125a2dfbc21f76a25c980609609e8218" # Nyuchi Web Services
compatibility_date = "2026-01-01"
workers_dev = false
preview_urls = false

# Builds the site, then the Worker. worker-build compiles the crate to wasm
# and writes crates/worker/build/.
[build]
command = "npm --prefix site ci && npm --prefix site run build && cd crates/worker && (command -v worker-build >/dev/null || cargo install -q worker-build --locked) && worker-build --release"

# /api/* runs the Worker; everything else is the static site.
[assets]
directory = "site/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Secrets (optional, `wrangler secret put` — never committed):
#   BLOCKED_TERMS — school, student and staff names that must never appear
#     in an image, one per line. The privacy gate refuses any render whose
#     text contains one, without echoing it.
#
# Phase 2 bindings still to add (owner):
#   [browser] binding = "BROWSER"      — Cloudflare Browser Rendering, for
#                                         capturing live pages
#   [[r2_buckets]] binding = "ASSETS_BUCKET", bucket_name = "nyuchi-tools-assets"
#                                       — generated sets and signed review URLs
