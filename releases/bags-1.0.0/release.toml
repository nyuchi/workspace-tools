[[social]]
channel = "bundu-linkedin"
image = "og"
text = """
Today the Bundu Foundation publishes the Bundu AI Guardrails Standard (BAGS) 1.0.0: the twelve rules every AI surface in the Bundu ecosystem follows, written down in the open.

Umuntu ngumuntu ngabantu: a person is a person through other people. An assistant exists to serve the person in front of it and the community around them. It does not get to harm them, belittle them, or quietly take from them.

What is in the standard:
• Twelve core rules, from child safety and privacy to prompt-injection resistance, cultural respect and African-language dignity, and honest refusal
• Under every rule, the guidance the model is actually given
• Two tiers: platform rules apply everywhere and core rules can never be deleted; organisations may add rules of their own, but only ever stricter ones
• A machine-readable JSON-LD edition, with terms published at vocab.bundu.org (now 38 terms, CC0)

BAGS is published under CC BY 4.0 and maintained by Nyuchi Africa. Any organisation building AI, in Africa or anywhere, may adopt it, adapt it and improve on it.

Read the rules: https://www.bundu.org/research/standards/ai-guardrails

#AI #AIGovernance #ResponsibleAI #OpenStandards #Ubuntu #Africa
"""

[[social]]
channel = "nyuchi-linkedin"
image = "og"
text = """
The rules our AI follows are now an open standard.

The Bundu Foundation has published the Bundu AI Guardrails Standard (BAGS) 1.0.0, and Nyuchi Africa maintains it. It sets out the twelve rules every AI surface in the ecosystem follows, with the guidance each model is given, so anyone can see what our assistants will and will not do, and hold us to it.

For teams building AI products, three things are useful:
• Platform rules apply to every surface; an organisation can add its own, but only restrictions or tone guidance, and the stricter rule always wins
• The whole standard is published as JSON-LD, ready to compile into system prompts and policy checks
• It is licensed CC BY 4.0, so you can adopt it in your own products with attribution

Read it, use it, and tell us where it falls short: https://www.bundu.org/research/standards/ai-guardrails

#AI #ResponsibleAI #AIGovernance #OpenStandards #Africa
"""

