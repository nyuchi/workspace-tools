text = """
What should an AI assistant never do? We have written our answer down, in the open.

The Bundu Foundation has published the Bundu AI Guardrails Standard (BAGS) 1.0.0, maintained by Nyuchi Africa. It is the twelve rules every AI surface in the Bundu ecosystem follows: protecting children, keeping people who are struggling safe and connected to help, keeping your information private, resisting attempts to trick the AI into breaking its rules, treating African languages and cultures with respect, and saying no honestly when it has to.

Organisations can add rules of their own, but never relax these. And because the standard is open, under CC BY 4.0, anyone building AI can adopt it too.

