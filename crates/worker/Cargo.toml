[package]
name = "nyuchi-tools-worker"
version = "0.1.0"
description = "The nyuchi-tools Worker on workers-rs: the image and signature API, serving the Astro site."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nyuchi-imaging = { path = "../imaging" }
nyuchi-signature = { path = "../signature" }
nyuchi-brands = { path = "../brands" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
crc32fast = "1"
sha2 = "0.10"
hmac = "0.12"
url = "2"
rmcp = { version = "3.11.0", default-features = false, features = ["server"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# rmcp (protocol types) pulls uuid, which on wasm32 needs a randomness source.
uuid = { version = "1", features = ["js"] }
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "SubtleCrypto"] }

[dev-dependencies]
png = "0.18"
