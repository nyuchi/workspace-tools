name: CI

on:
  # Merge queue: required checks must also run on the queue's merge group, or
  # queued PRs wait 60 minutes and drop out.
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main, staging]

# CI only reads the repo; never expose write scopes to the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # Root project: Worker deps (hono, MCP SDK) + worker test runner.
      - name: Install root dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run typecheck:worker

      # site/ is the tools site on the apps/nyuchi pattern — its own npm
      # project, and what the Worker deploys (wrangler.toml [assets]). It
      # also carries the engines' vitest suite (npm test below).
      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      # Runs both suites: the engines' tests (in site) + Worker HTTP tests.
      - name: Test
        run: npm test
