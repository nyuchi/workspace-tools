name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

# CI only reads the repo; never expose write scopes to the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            signature-generator/package-lock.json

      # Root project: Worker deps (hono, MCP SDK) + worker test runner.
      - name: Install root dependencies
        run: npm ci

      # signature-generator is its own npm project with its own lockfile.
      - name: Install signature-generator dependencies
        run: npm ci
        working-directory: signature-generator

      - name: Lint (signature-generator)
        run: npm run lint
        working-directory: signature-generator

      - name: Typecheck Worker
        run: npm run typecheck:worker

      # tsc -b && vite build — type-check is part of the build.
      - name: Build SPA
        run: npm run build
        working-directory: signature-generator

      # Runs both suites: signature-generator engines + Worker HTTP tests.
      - name: Test
        run: npm test

  # next/: the Rust rebuild (crates/imaging). Self-contained, no Node.
  imaging:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The renderer must stay buildable for Workers.
      - name: Build for wasm32
        run: cargo build --lib --release --locked --target wasm32-unknown-unknown

  # next/site: the Astro site for the rebuilt Worker (type check + build).
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next/site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/site/package-lock.json

      - name: Install
        run: npm ci

      - name: Check and build
        run: npm run build
