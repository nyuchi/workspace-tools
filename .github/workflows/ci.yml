name: CI

on:
  # Merge queue: required checks must also run on the queue's merge group, or
  # queued PRs wait 60 minutes and drop out.
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: [main, staging]

# CI only reads the repo; never expose write scopes to the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            signature-generator/package-lock.json
            site/package-lock.json

      # Root project: Worker deps (hono, MCP SDK) + worker test runner.
      - name: Install root dependencies
        run: npm ci

      # signature-generator is its own npm project with its own lockfile.
      - name: Install signature-generator dependencies
        run: npm ci
        working-directory: signature-generator

      - name: Lint (signature-generator)
        run: npm run lint
        working-directory: signature-generator

      - name: Typecheck Worker
        run: npm run typecheck:worker

      # tsc -b && vite build — type-check is part of the build. Still built:
      # the shared engines/' original home and tests, until retirement.
      - name: Build SPA (legacy signature-generator)
        run: npm run build
        working-directory: signature-generator

      # site/ is the tools-site rebuild on the apps/nyuchi pattern — its own
      # npm project, and what the Worker now deploys (wrangler.toml [assets]).
      - name: Install site dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      # Runs both suites: signature-generator engines + Worker HTTP tests.
      - name: Test
        run: npm test
