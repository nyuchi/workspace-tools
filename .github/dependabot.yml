# Automated dependency updates. Security updates open PRs immediately;
# version updates are weekly and grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # until Astro and typescript-eslint support TS 7; remove then
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: "/signature-generator"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # until Astro and typescript-eslint support TS 7; remove then
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
      day: monday
